<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="referrer"
        content="strict-origin-when-cross-origin">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <style>
        html,
        body,
        #player {
            width: 100%;
            height: 100%;
            margin: 0;
            border: 0;
            background: black;
            overflow: hidden;
        }
    </style>
</head>

<body>
<iframe
    id="player"
    title="YouTube player"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen>
</iframe>

<script>
    const VOLUME_STORAGE_KEY = "youtubePlayerVolume";
    const DEFAULT_VOLUME = 25;

    let player = null;
    let playerReady = false;

    let desiredPaused = false;
    let desiredVolume = loadStoredVolume();
    let stopped = false;

    // Retained until YouTube reports a valid duration.
    let pendingSeconds = null;

    function clampVolume(volume) {
        return Math.max(
            0,
            Math.min(100, Math.round(volume))
        );
    }

    function loadStoredVolume() {
        try {
            const storedValue = localStorage.getItem(
                VOLUME_STORAGE_KEY
            );

            if (storedValue === null)
                return DEFAULT_VOLUME;

            const parsed = Number(storedValue);

            if (!Number.isFinite(parsed))
                return DEFAULT_VOLUME;

            return clampVolume(parsed);
        } catch (error) {
            console.warn(
                "Unable to read stored volume:",
                error
            );

            return DEFAULT_VOLUME;
        }
    }

    function saveStoredVolume(volume) {
        try {
            localStorage.setItem(
                VOLUME_STORAGE_KEY,
                String(volume)
            );
        } catch (error) {
            console.warn(
                "Unable to store volume:",
                error
            );
        }
    }

    function report(message) {
        console.log(message);

        if (
            window.Unity &&
            typeof window.Unity.call === "function"
        ) {
            window.Unity.call(message);
        }
    }

    const videoId =
        new URLSearchParams(window.location.search).get("v");

    if (!/^[A-Za-z0-9_-]{11}$/.test(videoId || "")) {
        report("INVALID_VIDEO_ID");
        throw new Error("Invalid YouTube video ID");
    }

    window.SetPaused = function (paused) {
        desiredPaused =
            paused === true ||
            paused === "true" ||
            paused === 1;

        applyPlaybackSettings();
    };

    window.StopVideo = function () {
        stopped = true;
        desiredPaused = true;
        pendingSeconds = null;

        if (playerReady && player)
            player.stopVideo();

        document.documentElement.style.visibility = "hidden";
    };

    window.SetVolume = function (volume) {
        const parsed = Number(volume);

        if (!Number.isFinite(parsed))
            return;

        desiredVolume = clampVolume(parsed);

        // Persist the volume across new video page loads.
        saveStoredVolume(desiredVolume);

        applyPlaybackSettings();
    };

    window.SetSeconds = function (seconds) {
        const parsed = Number(seconds);

        if (!Number.isFinite(parsed))
            return;

        pendingSeconds = parsed;
        applyPendingSeek();
    };

    function applyPlaybackSettings() {
        if (stopped || !playerReady || !player)
            return;

        player.setVolume(desiredVolume);

        if (desiredVolume === 0)
            player.mute();
        else
            player.unMute();

        if (desiredPaused)
            player.pauseVideo();
        else
            player.playVideo();
    }

    function applyPendingSeek() {
        if (
            !playerReady ||
            !player ||
            pendingSeconds === null
        ) {
            return;
        }

        const duration = player.getDuration();

        if (!Number.isFinite(duration) || duration <= 0)
            return;

        // Wrap around the looping video's duration.
        const target =
            ((pendingSeconds % duration) + duration) % duration;

        // Clear before seekTo, because seeking triggers state events.
        pendingSeconds = null;

        player.seekTo(target, true);
        report(`SEEK=${target}`);
    }

    const iframe = document.getElementById("player");
    const origin = encodeURIComponent(window.location.origin);

    iframe.src =
        `https://www.youtube.com/embed/${videoId}` +
        `?enablejsapi=1` +
        `&autoplay=1` +
        `&playsinline=1` +
        `&controls=1` +
        `&loop=1` +
        `&playlist=${videoId}` +
        `&origin=${origin}`;

    const apiScript = document.createElement("script");
    apiScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(apiScript);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
            events: {
                onReady(event) {
                    player = event.target;
                    playerReady = true;

                    if (stopped) {
                        player.stopVideo();
                        return;
                    }

                    // The playlist contains the same video once.
                    player.setLoop(true);

                    // Applies the volume restored from localStorage.
                    applyPlaybackSettings();
                    applyPendingSeek();

                    // Duration may become available slightly later.
                    setTimeout(applyPendingSeek, 250);

                    report(
                        `READY volume=${desiredVolume}`
                    );
                },

                onStateChange(event) {
                    report(
                        `STATE=${event.data}` +
                        ` muted=${event.target.isMuted()}` +
                        ` volume=${event.target.getVolume()}`
                    );

                    applyPendingSeek();

                    // Fallback if automatic looping fails.
                    if (event.data === YT.PlayerState.ENDED) {
                        event.target.seekTo(0, true);

                        if (desiredPaused)
                            event.target.pauseVideo();
                        else
                            event.target.playVideo();
                    }
                },

                onAutoplayBlocked() {
                    report("AUTOPLAY_BLOCKED");
                },

                onError(event) {
                    report(`YOUTUBE_ERROR=${event.data}`);
                }
            }
        });
    }
</script>
</body>
</html>
