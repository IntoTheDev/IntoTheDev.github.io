<script>
    let player;
    let playerReady = false;

    let desiredPaused = false;
    let desiredVolume = 100;

    window.SetPaused = function (paused) {
        desiredPaused = Boolean(paused);
        applyPlayerSettings();
    };

    window.SetVolume = function (volume) {
        desiredVolume = Math.max(
            0,
            Math.min(100, Math.round(Number(volume)))
        );

        applyPlayerSettings();
    };

    function applyPlayerSettings() {
        if (!playerReady || !player)
            return;

        player.setVolume(desiredVolume);

        if (desiredVolume === 0)
            player.mute();
        else
            player.unMute();

        if (desiredPaused)
            player.pauseVideo();
        else
            player.playVideo();
    }

    function onYouTubeIframeAPIReady() {
        player = new YT.Player("player", {
            videoId: videoId,

            playerVars: {
                autoplay: 1,
                playsinline: 1,
                controls: 1,
                origin: location.origin
            },

            events: {
                onReady(event) {
                    player = event.target;
                    playerReady = true;

                    applyPlayerSettings();
                    report("READY");
                },

                onAutoplayBlocked() {
                    report("AUTOPLAY_BLOCKED");
                }
            }
        });
    }
</script>
